# TLS-гейт processmap.ru (standalone-паттерн, паритет со stage-gateway).
# 80:  ACME webroot (certbot) + 301 -> https.
# 443: TLS (certs/active/, см. deploy/prod-gateway/README.md) -> frontend:80
#       (внутренний роутер: /api, /agent, statics — frontend/nginx.conf).
# Сервис gateway, override: docker-compose.prod.standalone-gateway.yml.
# Заменяет кастомную сборку processmap-gateway:dev (frontend больше НЕ запекается
# в гейт — статику отдаёт app-frontend-1).

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name processmap.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name processmap.ru;

    ssl_certificate     /etc/nginx/certs/active/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/active/privkey.pem;

    client_max_body_size 60m;
    resolver 127.0.0.11 ipv6=off valid=30s;

    # HSTS сохраняем с прежнего edge-конфига (default.prod.tls.conf).
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://frontend:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_connect_timeout 10s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
        # SSE agent-stream: отдаём токены сразу, без буферизации.
        proxy_buffering off;
        proxy_cache off;
    }
}
