# TLS-гейт stage.processmap.ru для выделенного stage-хоста.
# 80:  ACME webroot (certbot) + 301 -> https.
# 443: TLS (certs/active/, см. deploy/stage-gateway/README.md) -> frontend:80.
# Запускается как сервис stage-gateway из docker-compose.stage.yml.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/active/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/active/privkey.pem;

    client_max_body_size 60m;
    resolver 127.0.0.11 ipv6=off valid=30s;

    location / {
        proxy_pass http://frontend:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_connect_timeout 10s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
        # SSE agent-stream: отдаём токены сразу, без буферизации.
        proxy_buffering off;
        proxy_cache off;
    }
}
