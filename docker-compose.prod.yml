services:
  api:
    ports: !override []
    env_file: !override
      - /opt/processmap/env/prod.env
    volumes:
      - /opt/processmap/data/prod/workspace:/app/workspace

  celery-worker:
    env_file: !override
      - /opt/processmap/env/prod.env

  # celery-beat (#1026-аналог для prod): ghcr-пакета celery-beat НЕТ
  # (проверено read-only 2026-09-23: packages api/celery-worker/agent/
  # notifications/frontend), beat = тот же бэкенд-образ, что celery-worker
  # (base-compose command/healthcheck наследуются).
  celery-beat:
    image: app-celery-worker:latest
    env_file: !override
      - /opt/processmap/env/prod.env

  agent:
    env_file: !override
      - /opt/processmap/env/prod.env

  notifications:
    env_file: !override
      - /opt/processmap/env/prod.env

  redis:
    ports: !override []

  postgres:
    ports: !override []
    volumes:
      - /opt/processmap/data/prod/postgres:/var/lib/postgresql/data

  frontend:
    ports: !override []
    networks:
      default:
      edge_shared:
        aliases:
          - prod-gateway

networks:
  edge_shared:
    name: ${EDGE_NETWORK_NAME:?EDGE_NETWORK_NAME is required}
    external: true
