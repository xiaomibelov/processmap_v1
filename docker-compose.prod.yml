services:
  api:
    ports: !override []
    env_file: !override
      - /opt/processmap/env/prod.env
    volumes:
      - /opt/processmap/data/prod/workspace:/app/workspace

  celery-worker:
    env_file: !override
      - /opt/processmap/env/prod.env

  agent:
    env_file: !override
      - /opt/processmap/env/prod.env

  notifications:
    env_file: !override
      - /opt/processmap/env/prod.env

  redis:
    ports: !override []

  postgres:
    ports: !override []
    volumes:
      - /opt/processmap/data/prod/postgres:/var/lib/postgresql/data

  frontend:
    ports: !override []
    networks:
      default:
      edge_shared:
        aliases:
          - prod-gateway

networks:
  edge_shared:
    name: ${EDGE_NETWORK_NAME:?EDGE_NETWORK_NAME is required}
    external: true
