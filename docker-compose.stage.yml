services:
  api:
    env_file:
      - .env.stage
    network_mode: host
    extra_hosts:
      - "postgres:172.20.0.2"
      - "redis:172.20.0.3"
    ports: !override []
    volumes:
      - ./runtime/stage/workspace:/app/workspace

  celery-worker:
    env_file:
      - .env.stage
    network_mode: host
    extra_hosts:
      - "postgres:172.20.0.2"
      - "redis:172.20.0.3"
    ports: !override []

  redis:
    ports: !override []

  postgres:
    ports: !override []
    volumes:
      - ./runtime/stage/postgres:/var/lib/postgresql/data

  frontend:
    ports: !override []
    volumes:
      - ./deploy/nginx/frontend.stage.host-api.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      default:
      edge_shared:
        aliases:
          - stage-gateway

networks:
  edge_shared:
    name: ${EDGE_NETWORK_NAME:?EDGE_NETWORK_NAME is required}
    external: true
