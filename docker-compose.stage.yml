services:
  api:
    image: processmap_stage-api:${STAGE_IMAGE_TAG:-local}
    env_file:
      - .env.stage
    ports: !override []
    volumes:
      - ./runtime/stage/workspace:/app/workspace

  redis:
    ports: !override []

  postgres:
    ports: !override []
    volumes:
      - ./runtime/stage/postgres:/var/lib/postgresql/data

  frontend:
    image: processmap_stage-frontend:${STAGE_IMAGE_TAG:-local}
    ports: !override []
    networks:
      default:
      edge_shared:
        aliases:
          - stage-gateway

  notifications:
    image: processmap_stage-notifications:${STAGE_IMAGE_TAG:-local}
    env_file:
      - .env.stage

  agent:
    image: processmap_stage-agent:${STAGE_IMAGE_TAG:-local}
    env_file:
      - .env.stage

networks:
  edge_shared:
    name: ${EDGE_NETWORK_NAME:?EDGE_NETWORK_NAME is required}
    external: true
