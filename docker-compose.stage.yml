# Stage-окружение на выделенном хосте (без общего prod-gateway).
# TLS терминирует сервис stage-gateway (deploy/stage-gateway/),
# домен stage.processmap.ru резолвится на этот хост напрямую.
# stage-gateway намеренно НЕ входит в UP_SERVICES deploy-stage.yml:
# CI-деплой его не пересоздаёт (свежие sha-теги гейтят только app-образы),
# конфиг-изменения применяются вручную: `docker compose ... up -d stage-gateway`.
services:
  api:
    image: processmap_stage-api:${STAGE_IMAGE_TAG:-local}
    env_file:
      - .env.stage
    ports: !override []
    volumes:
      - ./runtime/stage/workspace:/app/workspace

  redis:
    ports: !override []

  postgres:
    ports: !override []
    volumes:
      - ./runtime/stage/postgres:/var/lib/postgresql/data

  frontend:
    image: processmap_stage-frontend:${STAGE_IMAGE_TAG:-local}
    ports: !override []
    networks:
      - default

  celery-worker:
    image: processmap_stage-celery-worker:${STAGE_IMAGE_TAG:-local}
    env_file:
      - .env.stage

  notifications:
    image: processmap_stage-notifications:${STAGE_IMAGE_TAG:-local}
    env_file:
      - .env.stage

  agent:
    image: processmap_stage-agent:${STAGE_IMAGE_TAG:-local}
    env_file:
      - .env.stage

  # Freshness-гейт deploy-stage.yml требует image == processmap_stage-rag-embedder:${STAGE_IMAGE_TAG}.
  # Без оверрайда compose присваивает дефолтный тег :latest и гейт невыполним (runs 33930925383, 33964756507).
  rag-embedder:
    image: processmap_stage-rag-embedder:${STAGE_IMAGE_TAG:-local}

  # TLS-гейт stage: терминирует 80/443, проксирует во frontend (internal сеть).
  # Сертификаты: certbot webroot -> deploy/stage-gateway/certs/letsencrypt,
  # активные файлы -> deploy/stage-gateway/certs/active/ (deploy/stage-gateway/README.md).
  # Bootstrap до выпуска серта: самоподписанный active/fullchain.pem + privkey.pem.
  stage-gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/stage-gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/stage-gateway/certs/active:/etc/nginx/certs/active:ro
      - ./deploy/stage-gateway/certbot-webroot:/var/www/certbot:ro
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 80 && nc -z 127.0.0.1 443 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 5s
    depends_on:
      - frontend
    networks:
      - default
