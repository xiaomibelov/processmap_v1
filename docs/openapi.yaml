info:
  contact:
    name: ProcessMap
  description: 'REST API ProcessMap — системы описания и исполнения технологических
    процессов роботизированных кухонь (BPMN-диаграммы, интервью-извлечение, TO BE-трансформация,
    LLM-помощники, отчёты, администрирование организаций).


    **Аутентификация**: JWT access token в заголовке `Authorization: Bearer <token>`
    (получение — `POST /api/auth/login`). Мультитенантность: активная организация
    передаётся заголовком `X-Org-Id` (необязателен, если у пользователя одна организация
    или выбрана активная).


    **Формат ошибок**: большинство доменных ошибок — `{"detail": {"code", "message"}}`
    с соответствующим HTTP-статусом; ошибки валидации FastAPI — HTTP 422.


    Интерактивный просмотр этой спеки также доступен на живом сервере: `/api/docs`
    (Swagger UI), `/api/redoc`.'
  license:
    name: Proprietary
    url: https://processmap.ru
  title: Processmap API
  version: 1.0.141
openapi: 3.0.3
paths:
  /api/admin/agent-runs:
    get:
      description: 'Получить agent runs. Особенности: доступ: администратор платформы/организации.'
      operationId: admin_agent_runs_api_admin_agent_runs_get
      parameters:
      - in: query
        name: user_id
        required: false
        schema:
          default: ''
          title: User Id
          type: string
      - in: query
        name: org_id
        required: false
        schema:
          default: ''
          title: Org Id
          type: string
      - in: query
        name: limit
        required: false
        schema:
          default: 20
          title: Limit
          type: integer
      - in: query
        name: offset
        required: false
        schema:
          default: 0
          title: Offset
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                title: Response Admin Agent Runs Api Admin Agent Runs Get
          description: Successful Response
        '401':
          description: 'Не аутентифицирован: отсутствует или недействителен JWT access
            token (Authorization: Bearer)'
        '403':
          description: 'Доступ запрещён: требуется роль admin или членство в организации
            с нужными правами'
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - bearerAuth: []
      summary: Получить agent runs
      tags:
      - admin
  /api/admin/agent-runs/{conversation_id}:
    get:
      description: 'Получить agent runs. Особенности: доступ: администратор платформы/организации;
        404 — ресурс не найден/вне scope.'
      operationId: admin_agent_run_detail_api_admin_agent_runs__conversation_id__get
      parameters:
      - in: path
        name: conversation_id
        required: true
        schema:
          title: Conversation Id
          type: string
      - in: query
        name: refresh
        required: false
        schema:
          default: false
          title: Refresh
          type: boolean
      responses:
        '200':
          content:
            application/json:
              schema:
                title: Response Admin Agent Run Detail Api Admin Agent Runs  Conversation
                  Id  Get
          description: Successful Response
        '401':
          description: 'Не аутентифицирован: отсутствует или недействителен JWT access
            token (Authorization: Bearer)'
        '403':
          description: 'Доступ запрещён: требуется роль admin или членство в организации
            с нужными правами'
        '404':
          description: Conversation not found
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - bearerAuth: []
      summary: Получить agent runs
      tags:
      - admin
  /api/admin/ai/executions:
    get:
      description: 'Получить executions. Особенности: доступ: администратор платформы/организации.'
