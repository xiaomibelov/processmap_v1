openapi: 3.0.3
info:
  title: Processmap API
  version: 1.0.141
  description: 'REST API ProcessMap — системы описания и исполнения технологических процессов роботизированных кухонь (BPMN-диаграммы, интервью-извлечение,
    TO BE-трансформация, LLM-помощники, отчёты, администрирование организаций).


    **Аутентификация**: JWT access token в заголовке `Authorization: Bearer <token>` (получение — `POST /api/auth/login`). Мультитенантность:
    активная организация передаётся заголовком `X-Org-Id` (необязателен, если у пользователя одна организация или выбрана активная).


    **Формат ошибок**: большинство доменных ошибок — `{"detail": {"code", "message"}}` с соответствующим HTTP-статусом; ошибки валидации FastAPI
    — HTTP 422.


    Интерактивный просмотр этой спеки также доступен на живом сервере: `/api/docs` (Swagger UI), `/api/redoc`.'
  contact:
    name: ProcessMap
  license:
    name: Proprietary
    url: https://processmap.ru
servers:
- url: https://processmap.ru
  description: Прод
- url: https://stage.processmap.ru
  description: Стейдж
- url: http://127.0.0.1:8011
  description: Локальная разработка
