<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Processmap API — Swagger UI</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5/swagger-ui.css" />
  <style>
    body { margin: 0; }
    .topnote { padding: 10px 16px; font: 14px/1.5 system-ui, sans-serif; background: #fff8e6; border-bottom: 1px solid #e5d9b0; }
    .topnote code { background: #f1f1f1; padding: 1px 4px; border-radius: 4px; }
  </style>
</head>
<body>
  <div class="topnote">
    Статический просмотр <code>docs/openapi.yaml</code> (Processmap API, OpenAPI 3.0.3).
    На живом сервере спека доступна как <code>/api/openapi.json</code>, Swagger UI — <code>/api/docs</code>, ReDoc — <code>/api/redoc</code>.
    Для локального просмотра: <code>npx serve docs</code> и открыть <code>/swagger-ui/</code>.
  </div>
  <div id="swagger-ui"></div>
  <script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-bundle.js"></script>
  <script>
    window.ui = SwaggerUIBundle({
      url: "../openapi.yaml",
      dom_id: "#swagger-ui",
      deepLinking: true,
      displayRequestDuration: true,
      tryItOutEnabled: true,
      persistAuthorization: true,
      defaultModelsExpandDepth: 1,
      docExpansion: "list"
    });
  </script>
</body>
</html>
