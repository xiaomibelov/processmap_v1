name: Frontend Quality

on:
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-quality.yml"
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-quality.yml"

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: ESLint no-undef gate
        working-directory: frontend
        run: npm run lint

      # Test gate (contour refactor/workspace-explorer-s0-tests):
      # frontend tests must execute on every PR; red tests = red PR.
      - name: Characterization tests (workspace explorer, Ш0)
        working-directory: frontend
        run: npm run test:char

      - name: Smoke tests
        working-directory: frontend
        run: npm run test:smoke

      # Explorer-scoped node:test suite (model unit tests + retargeted
      # source tests). The FULL node --test suite is not gated yet: it has
      # 86 pre-existing failures unrelated to the explorer (see
      # .planning/contours/refactor/workspace-explorer-s0-tests/PR.md);
      # gating it is a follow-up contour.
      - name: Explorer unit & source tests (node --test)
        working-directory: frontend
        run: node --test $(find src/features/explorer src/test-utils -name '*.test.mjs' -type f)
