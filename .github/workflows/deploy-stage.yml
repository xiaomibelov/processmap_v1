name: Deploy to Legacy Host

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # ДИСКЛЕЙМЕР: этот workflow деплоит НЕ на stage clearvestnic.ru:5177.
      - name: Deploy target disclaimer
        shell: bash
        run: |
          echo "::warning::This workflow deploys to /opt/processmap/app via STAGE_HOST secret — NOT to stage clearvestnic.ru:5177."
          echo "::warning::Stage clearvestnic.ru:5177 обновляется только вручную через deploy/deploy.sh на сервере."

      - name: Checkout source
        uses: actions/checkout@v4
        with:
          # полная история нужна шагу "Detect agent service changes" (git diff before..sha)
          fetch-depth: 0

      - name: Compute build metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          build_time="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          bundle_name="processmap-stage-images-${GITHUB_SHA}.tar.gz"
          {
            echo "build_time=${build_time}"
            echo "bundle_name=${bundle_name}"
          } >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # AGENT-SVC: agent-образ собираем только при изменении backend/services/agent/**
      # (решение владельца). Если before-sha недоступен — считаем изменённым (safe).
      - name: Detect agent service changes
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          before="${{ github.event.before }}"
          if [ -z "${before}" ] || [ "${before}" = "0000000000000000000000000000000000000000" ]; then
            echo "[changes] before-sha unavailable; assuming agent changed"
            echo "agent=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          if git diff --name-only "${before}" "${GITHUB_SHA}" | grep -q '^backend/services/agent/'; then
            echo "[changes] backend/services/agent changed"
            echo "agent=true" >> "${GITHUB_OUTPUT}"
          else
            echo "[changes] backend/services/agent unchanged"
            echo "agent=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Build stage api image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          load: true
          tags: processmap_stage-api:${{ github.sha }}
          build-args: |
            BUILD_ID=${{ github.sha }}
            BUILD_TIME=${{ steps.meta.outputs.build_time }}
            BUILD_BRANCH=main
            BUILD_ENV=stage

      - name: Build stage frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          load: true
          tags: processmap_stage-frontend:${{ github.sha }}
          build-args: |
            VITE_BUILD_ID=${{ github.sha }}
            VITE_BUILD_TIME=${{ steps.meta.outputs.build_time }}
            VITE_BUILD_BRANCH=main
            VITE_BUILD_ENV=stage
            VITE_DEPLOY_FINGERPRINT=processmap-stage-deploy-sha:${{ github.sha }}
            VITE_DEPLOY_REQUESTED_REF=main
            VITE_DEPLOY_RESOLVED_SHA=${{ github.sha }}

      - name: Build stage notifications image
        uses: docker/build-push-action@v6
        with:
          context: ./backend/services/notifications
          file: ./backend/services/notifications/Dockerfile
          load: true
          tags: processmap_stage-notifications:${{ github.sha }}

      - name: Build stage agent image
        if: steps.changes.outputs.agent == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./backend/services/agent
          file: ./backend/services/agent/Dockerfile
          load: true
          tags: processmap_stage-agent:${{ github.sha }}

      - name: Pack stage images
        shell: bash
        run: |
          set -euo pipefail
          images=(
            "processmap_stage-api:${GITHUB_SHA}"
            "processmap_stage-frontend:${GITHUB_SHA}"
            "processmap_stage-notifications:${GITHUB_SHA}"
          )
          if [ "${{ steps.changes.outputs.agent }}" = "true" ]; then
            images+=("processmap_stage-agent:${GITHUB_SHA}")
          fi
          docker image inspect "${images[@]}" >/dev/null
          docker save "${images[@]}" \
            | gzip -1 > "${{ steps.meta.outputs.bundle_name }}"
          gzip -t "${{ steps.meta.outputs.bundle_name }}"
          ls -lh "${{ steps.meta.outputs.bundle_name }}"

      - name: Copy stage images to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.STAGE_HOST }}
          username: ${{ secrets.STAGE_USER }}
          key: ${{ secrets.STAGE_SSH_KEY }}
          source: ${{ steps.meta.outputs.bundle_name }}
          target: /tmp
          overwrite: true

      - name: Deploy to stage server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGE_HOST }}
          username: ${{ secrets.STAGE_USER }}
          key: ${{ secrets.STAGE_SSH_KEY }}
          command_timeout: 15m
          script: |
            set -euo pipefail
            cd /opt/processmap/app

            REQUESTED_REF="main"
            EXPECTED_SHA="${{ github.sha }}"
            IMAGE_BUNDLE="/tmp/${{ steps.meta.outputs.bundle_name }}"

            echo "[deploy-stage] preflight: stage boundary"
            test -f ".env.stage"
            test -f "docker-compose.yml"
            test -f "docker-compose.stage.yml"
            stage_api_count="$(docker ps -q \
              --filter label=com.docker.compose.project=processmap_stage \
              --filter label=com.docker.compose.service=api | wc -l | tr -d ' ')"
            prod_api_count="$(docker ps -q \
              --filter label=com.docker.compose.project=app \
              --filter label=com.docker.compose.service=api | wc -l | tr -d ' ')"
            echo "[deploy-stage] stage api containers: ${stage_api_count}"
            echo "[deploy-stage] prod api containers visible but not targeted: ${prod_api_count}"
            [ "${stage_api_count}" -ge 1 ] || {
              echo "[deploy-stage] ERROR: processmap_stage api container not found" >&2
              exit 1
            }
            [ -s "${IMAGE_BUNDLE}" ] || {
              echo "[deploy-stage] ERROR: image bundle missing or empty: ${IMAGE_BUNDLE}" >&2
              exit 1
            }

            echo "[deploy-stage] preflight: stage egress diagnostic (non-blocking)"
            STAGE_API_CID="$(docker ps -q \
              --filter label=com.docker.compose.project=processmap_stage \
              --filter label=com.docker.compose.service=api | head -n1)"
            if timeout 4s docker exec "${STAGE_API_CID}" getent hosts vvchat.vkusvill.ru >/dev/null 2>&1; then
              echo "[deploy-stage] stage container egress DNS: OK"
            else
              echo "::warning::[deploy-stage] stage container egress DNS failed; deploying prebuilt images anyway"
            fi

            echo "[deploy-stage] requested ref: ${REQUESTED_REF}"
            echo "[deploy-stage] expected sha: ${EXPECTED_SHA}"

            git remote set-url origin git@github.com:xiaomibelov/processmap_v1.git
            git fetch origin main
            DEPLOY_SHA="$(git rev-parse --verify origin/main)"
            echo "[deploy-stage] resolved sha: ${DEPLOY_SHA}"
            [ "${DEPLOY_SHA}" = "${EXPECTED_SHA}" ] || {
              echo "[deploy-stage] ERROR: origin/main ${DEPLOY_SHA} != workflow sha ${EXPECTED_SHA}" >&2
              exit 1
            }

            PRESERVE_DIR="$(mktemp -d /tmp/processmap-stage-preserve.XXXXXX)"
            for path in \
              .env \
              .env.stage \
              docker-compose.ssl.yml \
              docker-compose.prod.yml \
              docker-compose.prod.gateway.yml \
              backend/alembic.stage.ini; do
              if [ -e "${path}" ]; then
                mkdir -p "${PRESERVE_DIR}/$(dirname "${path}")"
                cp -a "${path}" "${PRESERVE_DIR}/${path}"
              fi
            done

            # Full checkout makes the stage worktree consistent after a failed
            # previous checkout; server-only config files are restored below.
            git checkout -f "${DEPLOY_SHA}"

            for path in \
              .env \
              .env.stage \
              docker-compose.ssl.yml \
              docker-compose.prod.yml \
              docker-compose.prod.gateway.yml \
              backend/alembic.stage.ini; do
              if [ -e "${PRESERVE_DIR}/${path}" ]; then
                mkdir -p "$(dirname "${path}")"
                cp -a "${PRESERVE_DIR}/${path}" "${path}"
              fi
            done

            echo "[deploy-stage] source diagnostics:"
            git status --short
            echo "[deploy-stage] file checksums after checkout:"
            sha256sum frontend/src/App.jsx frontend/src/components/NotesMvpPanel.jsx 2>/dev/null || true
            echo "[deploy-stage] App.jsx sessions:"
            grep -n "const \[sessions" frontend/src/App.jsx || echo "NOT FOUND"
            grep -n "sessions={sessions}" frontend/src/App.jsx || echo "NOT FOUND"
            echo "[deploy-stage] NotesMvpPanel sessions prop:"
            grep -n "sessions = \[\]" frontend/src/components/NotesMvpPanel.jsx || echo "NOT FOUND"

            STAGE_FRESHNESS_SOURCE_FILE="/tmp/processmap-stage-deploy-fingerprint-${REQUESTED_REF//[^A-Za-z0-9._-]/_}-${DEPLOY_SHA:0:12}.json"
            export STAGE_FRESHNESS_SOURCE_FILE

            deploy/scripts/stage_freshness_proof.sh prepare-source \
              --requested-ref "${REQUESTED_REF}" \
              --resolved-sha "${DEPLOY_SHA}"

            BUILD_TIME="${{ steps.meta.outputs.build_time }}"

            export BUILD_ID="${DEPLOY_SHA}"
            export BUILD_BRANCH="${REQUESTED_REF}"
            export BUILD_TIME="${BUILD_TIME}"
            export BUILD_ENV="stage"
            export VITE_BUILD_ID="${DEPLOY_SHA}"
            export VITE_BUILD_BRANCH="${REQUESTED_REF}"
            export VITE_BUILD_TIME="${BUILD_TIME}"
            export VITE_BUILD_ENV="stage"

            DEPLOY_FINGERPRINT="processmap-stage-deploy-sha:${DEPLOY_SHA}"
            export VITE_DEPLOY_FINGERPRINT="${DEPLOY_FINGERPRINT}"
            export VITE_DEPLOY_REQUESTED_REF="${REQUESTED_REF}"
            export VITE_DEPLOY_RESOLVED_SHA="${DEPLOY_SHA}"
            export STAGE_IMAGE_TAG="${DEPLOY_SHA}"

            ENV_FILE=".env.stage"
            sed -i '/^BUILD_ID=/d; /^BUILD_TIME=/d; /^BUILD_BRANCH=/d; /^BUILD_ENV=/d; /^VITE_BUILD_ID=/d; /^VITE_BUILD_TIME=/d; /^VITE_BUILD_BRANCH=/d; /^VITE_BUILD_ENV=/d; /^VITE_DEPLOY_FINGERPRINT=/d; /^VITE_DEPLOY_REQUESTED_REF=/d; /^VITE_DEPLOY_RESOLVED_SHA=/d; /^STAGE_IMAGE_TAG=/d' "${ENV_FILE}"
            {
              echo ""
              echo "# Auto-injected by deploy-stage.yml at ${BUILD_TIME}"
              echo "BUILD_ID=${DEPLOY_SHA}"
              echo "BUILD_TIME=${BUILD_TIME}"
              echo "BUILD_BRANCH=${REQUESTED_REF}"
              echo "BUILD_ENV=stage"
              echo "VITE_BUILD_ID=${DEPLOY_SHA}"
              echo "VITE_BUILD_TIME=${BUILD_TIME}"
              echo "VITE_BUILD_BRANCH=${REQUESTED_REF}"
              echo "VITE_BUILD_ENV=stage"
              echo "VITE_DEPLOY_FINGERPRINT=${DEPLOY_FINGERPRINT}"
              echo "VITE_DEPLOY_REQUESTED_REF=${REQUESTED_REF}"
              echo "VITE_DEPLOY_RESOLVED_SHA=${DEPLOY_SHA}"
              echo "STAGE_IMAGE_TAG=${DEPLOY_SHA}"
            } >> "${ENV_FILE}"

            STAGE_IMAGE_TAG="${DEPLOY_SHA}" APP_ENV_FILE=.env.stage docker compose \
              --env-file .env.stage \
              -f docker-compose.yml \
              -f docker-compose.stage.yml \
              -p processmap_stage \
              config --quiet

            echo "[deploy-stage] loading GitHub-built images"
            gzip -dc "${IMAGE_BUNDLE}" | docker load
            docker image inspect \
              "processmap_stage-api:${DEPLOY_SHA}" \
              "processmap_stage-frontend:${DEPLOY_SHA}" \
              "processmap_stage-notifications:${DEPLOY_SHA}" >/dev/null

            # AGENT-SVC: agent-образ собран только если менялся backend/services/agent/**.
            # Иначе running agent-контейнер (если есть) остаётся на прежнем образе.
            AGENT_CHANGED="${{ steps.changes.outputs.agent }}"
            if [ "${AGENT_CHANGED}" = "true" ]; then
              docker image inspect "processmap_stage-agent:${DEPLOY_SHA}" >/dev/null
            else
              echo "[deploy-stage] agent unchanged; skipping agent image inspect/restart"
            fi

            echo "[deploy-stage] current frontend mounts:"
            docker inspect processmap_stage-frontend-1 --format='{{json .Mounts}}' 2>/dev/null || true
            echo "[deploy-stage] current frontend assets:"
            docker exec processmap_stage-frontend-1 sh -c 'ls -la /usr/share/nginx/html/assets/index-*.js 2>/dev/null || true' 2>/dev/null || true

            STAGE_IMAGE_TAG="${DEPLOY_SHA}" APP_ENV_FILE=.env.stage docker compose \
              --env-file .env.stage \
              -f docker-compose.yml \
              -f docker-compose.stage.yml \
              -p processmap_stage \
              rm -fsv frontend 2>/dev/null || true
            docker volume ls -q | grep '^processmap_stage_frontend' | xargs -r docker volume rm 2>/dev/null || true

            UP_SERVICES="api frontend notifications"
            if [ "${AGENT_CHANGED}" = "true" ]; then
              UP_SERVICES="${UP_SERVICES} agent"
            fi
            STAGE_IMAGE_TAG="${DEPLOY_SHA}" APP_ENV_FILE=.env.stage docker compose \
              --env-file .env.stage \
              -f docker-compose.yml \
              -f docker-compose.stage.yml \
              -p processmap_stage \
              up -d --no-build --no-deps --force-recreate -V ${UP_SERVICES}

            echo "[deploy-stage] new frontend mounts:"
            docker inspect processmap_stage-frontend-1 --format='{{json .Mounts}}' 2>/dev/null || true
            echo "[deploy-stage] new frontend assets:"
            docker exec processmap_stage-frontend-1 sh -c 'ls -la /usr/share/nginx/html/assets/index-*.js 2>/dev/null || true' 2>/dev/null || true

            deploy/scripts/stage_freshness_proof.sh verify-chain \
              --requested-ref "${REQUESTED_REF}" \
              --resolved-sha "${DEPLOY_SHA}"

            rm -f "${STAGE_FRESHNESS_SOURCE_FILE}"

            echo "[deploy-stage] done ref=${REQUESTED_REF} sha=${DEPLOY_SHA}"
