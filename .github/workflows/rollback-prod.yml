name: Rollback Prod

# Штатный откат prod (PLAN §2.7): обёртка над
# /opt/processmap/bin/processmap-rollback-manual.sh (--check/--apply) с тем же
# approve-гейтом environment: prod. Метка predeploy-<TS> берётся из summary
# деплоя (файл last-deploy-summary-<TS>.md на хосте) или лога deploy-шага.
# Откат ДАННЫХ этим workflow не выполняется — только restore из дампа окна
# деплоя (путь в summary), под отдельный approve владельца.
on:
  workflow_dispatch:
    inputs:
      predeploy_ts:
        description: "Метка окна деплоя (например 20260913120000) — из summary деплоя / лога deploy-шага."
        required: true

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  rollback:
    name: Rollback prod to predeploy images
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Rollback check + apply on prod host
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          command_timeout: 15m
          script: |
            set -euo pipefail

            TS="${{ github.event.inputs.predeploy_ts }}"
            echo "[rollback-prod] predeploy_ts=${TS}"

            /opt/processmap/bin/processmap-rollback-manual.sh --check --ts "${TS}"
            /opt/processmap/bin/processmap-rollback-manual.sh --apply --ts "${TS}"

            echo "[rollback-prod] post-verify:"
            curl -fsS https://processmap.ru/version
            echo
            curl -fsS https://processmap.ru/api/health
            echo

      - name: Write rollback summary
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## Откат prod выполнен (predeploy_ts=${{ github.event.inputs.predeploy_ts }})"
            echo ""
            echo "- Образы api/celery-worker/agent/notifications/frontend возвращены к метке predeploy-${{ github.event.inputs.predeploy_ts }}."
            echo "- Post-verify: /version и /api/health проверены на хосте."
            echo "- **Откат данных — только restore из дампа** окна деплоя (путь в summary деплоя: /opt/processmap/data/prod/backups/pre-pipeline-<TS>.dump) — отдельный approve владельца."
            echo "- Ручной fallback: deploy/prod-rollback-manual.md."
          } >> "${GITHUB_STEP_SUMMARY}"
