name: Stage Export Uncommitted Changes (TEMP, delete after use)

on:
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Export ITMO v0.2 candidate BPMN from stage DB (read-only)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGE_HOST }}
          username: ${{ secrets.STAGE_USER }}
          key: ${{ secrets.STAGE_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -u
            PG=$(docker ps --format '{{.Names}}' | grep -i postgres | head -1)
            Q() { docker exec "$PG" psql -U stage_fpc -d processmap_stage -t -A -c "$1" 2>&1; }
            echo "=== candidates with legacy markers ==="
            Q "select id, left(title,40), length(bpmn_xml), bpmn_xml like '%validator_profile_id%' as vpid, bpmn_xml like '%actor_kind%' as ak, bpmn_xml like '%grasp_object%' as go, bpmn_xml like '%move_object%' as mo from sessions where deleted_at is null and (bpmn_xml like '%validator_profile_id%' or bpmn_xml like '%actor_kind%' or bpmn_xml like '%grasp_object%') limit 10;"
            mkdir -p /tmp/itmo
            Q "select bpmn_xml from sessions where id='ec61bf3ccb';" > /tmp/itmo/itmo_v02_ec61bf3ccb.bpmn 2>&1
            wc -c /tmp/itmo/itmo_v02_ec61bf3ccb.bpmn
            tar czf /tmp/itmo_export.tar.gz -C /tmp itmo
            echo '=====ITMO_EXPORT_B64_BEGIN====='
            base64 /tmp/itmo_export.tar.gz
            echo '=====ITMO_EXPORT_B64_END====='
