name: Stage Export Uncommitted Changes (TEMP, delete after use)

on:
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Collect uncommitted E1/E2 changes on stage server (read-only)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGE_HOST }}
          username: ${{ secrets.STAGE_USER }}
          key: ${{ secrets.STAGE_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -euo pipefail
            echo "[export] hostname: $(hostname)"
            cd /opt/processmap/app
            git rev-parse HEAD > /tmp/e12_base.txt
            git branch --show-current >> /tmp/e12_base.txt || true
            git status --porcelain=v1 > /tmp/e12_status.txt || true
            git diff > /tmp/e12_tracked.diff || true
            { git diff --name-only; git ls-files --others --exclude-standard; } | sort -u > /tmp/e12_files_all.txt
            # Safety filter: exclude secrets/env/keys/logs/caches
            grep -v -i -E '(^|/)(\.env|.*\.env|.*\.env\..*|env/.*|.*secret.*|.*password.*|.*credential.*|.*\.pem|.*\.key|id_rsa.*|.*\.log|.*__pycache__.*|node_modules/.*|.*\.pyc|.*\.sqlite.*|.*\.db)$' /tmp/e12_files_all.txt > /tmp/e12_files.txt || true
            echo "[export] files to export: $(wc -l < /tmp/e12_files.txt)"
            echo "[export] excluded by safety filter: $(comm -23 /tmp/e12_files_all.txt <(sort /tmp/e12_files.txt) | wc -l) entries"
            comm -23 /tmp/e12_files_all.txt <(sort /tmp/e12_files.txt) | head -30 || true
            if [ -s /tmp/e12_files.txt ]; then
              tar czf /tmp/e12_changes.tar.gz -T /tmp/e12_files.txt
            else
              tar czf /tmp/e12_changes.tar.gz --files-from /dev/null
            fi
            tar czf /tmp/e12_export.tar.gz -C /tmp e12_base.txt e12_status.txt e12_tracked.diff e12_files.txt e12_changes.tar.gz
            ls -la /tmp/e12_export.tar.gz

      - name: Copy export archive from stage to runner
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.STAGE_HOST }}
          username: ${{ secrets.STAGE_USER }}
          key: ${{ secrets.STAGE_SSH_KEY }}
          source: "/tmp/e12_export.tar.gz"
          target: "./e12_export"
          strip_components: 0

      - name: Locate downloaded archive
        id: locate
        run: |
          FOUND=$(find . -name 'e12_export.tar.gz' | head -1)
          echo "found=$FOUND" >> "$GITHUB_OUTPUT"
          ls -la "$FOUND"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: e12-export
          path: ${{ steps.locate.outputs.found }}
          retention-days: 3
