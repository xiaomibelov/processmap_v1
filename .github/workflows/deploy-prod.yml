name: Deploy to Prod

# Прод-деплой ТОЛЬКО вручную через workflow_dispatch с approve-гейтом
# GitHub Environment `prod` (required reviewer = владелец). Auto-deploy по
# push в main не проектируется (PLAN §1). Страховка (бэкап БД + predeploy-теги)
# неотключаема — никаких skip_backup-флагов.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to deploy (branch, tag, or commit SHA). Empty = deploy latest origin/main."
        required: false
        default: ""

# Прод-деплои не должны пересекаться: очередь per environment.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: xiaomibelov/processmap_v1

jobs:
  # Fail-fast гейты (PLAN §2.2) ДО любых изменений на хосте. Job строго
  # read-only (git status, alembic heads, curl, df, crontab -l) — environment-гейт
  # не требуется (раньше был: двойной approve на run, факт T1 2026-09-13).
  # Регламентный approve владельца = гейт job'а deploy (environment: prod).
  gates:
    name: Preflight gates on prod host
    runs-on: ubuntu-latest
    outputs:
      requested_ref: ${{ steps.resolve.outputs.requested_ref }}
      deploy_sha: ${{ steps.resolve.outputs.deploy_sha }}
      build_time: ${{ steps.meta.outputs.build_time }}
      ts: ${{ steps.meta.outputs.ts }}
    steps:
      - name: Deploy target disclaimer
        shell: bash
        run: |
          echo "::warning::This workflow deploys PROD at /opt/processmap/app on PROD_HOST."
          echo "::warning::Prod URL: https://processmap.ru; stage URL: https://stage.processmap.ru."

      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Guard against SHA race: main may advance between trigger and deploy.
      # Resolve the ref we actually want to deploy *after* checkout/fetch and
      # pass that resolved SHA to the server (паттерн deploy-stage.yml).
      - name: Resolve deploy ref and SHA
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          REQUESTED_REF="${{ github.event.inputs.ref || 'main' }}"
          echo "requested_ref=${REQUESTED_REF}" >> "${GITHUB_OUTPUT}"

          if git show-ref --verify --quiet "refs/remotes/origin/${REQUESTED_REF}" 2>/dev/null; then
            git fetch origin "${REQUESTED_REF}"
            DEPLOY_SHA="$(git rev-parse --verify "origin/${REQUESTED_REF}")"
          else
            git fetch origin || true
            DEPLOY_SHA="$(git rev-parse --verify "${REQUESTED_REF}^{commit}" 2>/dev/null || git rev-parse --verify "${REQUESTED_REF}")"
          fi

          echo "deploy_sha=${DEPLOY_SHA}" >> "${GITHUB_OUTPUT}"
          echo "[resolve] requested_ref=${REQUESTED_REF} deploy_sha=${DEPLOY_SHA}"

      # TS генерируется в CI и передаётся на хост: summary и команда отката
      # обязаны ссылаться на ту же метку окна, что и predeploy-теги/дамп.
      - name: Compute build metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "ts=$(date -u +%Y%m%d%H%M%S)"
          } >> "${GITHUB_OUTPUT}"

      - name: Sync preflight gates script to prod host
        shell: bash
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_USER: ${{ secrets.PROD_USER }}
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
        run: |
          set -euo pipefail
          KEY_FILE="$(mktemp)"
          printf '%s\n' "${PROD_SSH_KEY}" > "${KEY_FILE}"
          chmod 600 "${KEY_FILE}"
          ssh -o StrictHostKeyChecking=accept-new -i "${KEY_FILE}" \
            "${PROD_USER}@${PROD_HOST}" "mkdir -p /opt/processmap/bin"
          scp -o StrictHostKeyChecking=accept-new -i "${KEY_FILE}" \
            deploy/scripts/prod_preflight_gates.sh \
            "${PROD_USER}@${PROD_HOST}:/opt/processmap/bin/prod_preflight_gates.sh"
          rm -f "${KEY_FILE}"

      - name: Run preflight gates
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          command_timeout: 5m
          script: |
            set -euo pipefail
            bash /opt/processmap/bin/prod_preflight_gates.sh

  # Сборка образов в CI (PLAN §2.3). rag-embedder НЕ собирается здесь:
  # ONNX-экспорт на этапе сборки хост-специфичен, собирается на хосте в deploy.
  build:
    name: Build & push images
    needs: gates
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.gates.outputs.deploy_sha }}

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Корневой Dockerfile: один образ на api и celery-worker (две метки).
      - name: Build & push backend image (api + celery-worker)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/api:${{ needs.gates.outputs.deploy_sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/celery-worker:${{ needs.gates.outputs.deploy_sha }}
          build-args: |
            BUILD_ID=${{ needs.gates.outputs.deploy_sha }}
            BUILD_TIME=${{ needs.gates.outputs.build_time }}
            BUILD_BRANCH=${{ needs.gates.outputs.requested_ref }}
            BUILD_ENV=prod
          cache-from: type=gha,scope=prod-backend
          cache-to: type=gha,mode=max,scope=prod-backend

      - name: Build & push agent
        uses: docker/build-push-action@v6
        with:
          context: ./backend/services/agent
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/agent:${{ needs.gates.outputs.deploy_sha }}
          cache-from: type=gha,scope=prod-agent
          cache-to: type=gha,mode=max,scope=prod-agent

      - name: Build & push notifications
        uses: docker/build-push-action@v6
        with:
          context: ./backend/services/notifications
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/notifications:${{ needs.gates.outputs.deploy_sha }}
          cache-from: type=gha,scope=prod-notifications
          cache-to: type=gha,mode=max,scope=prod-notifications

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/frontend:${{ needs.gates.outputs.deploy_sha }}
          build-args: |
            VITE_BUILD_ID=${{ needs.gates.outputs.deploy_sha }}
            VITE_BUILD_TIME=${{ needs.gates.outputs.build_time }}
            VITE_BUILD_BRANCH=${{ needs.gates.outputs.requested_ref }}
            VITE_BUILD_ENV=prod
            VITE_DEPLOY_FINGERPRINT=processmap-prod-deploy-sha:${{ needs.gates.outputs.deploy_sha }}
            VITE_DEPLOY_REQUESTED_REF=${{ needs.gates.outputs.requested_ref }}
            VITE_DEPLOY_RESOLVED_SHA=${{ needs.gates.outputs.deploy_sha }}
          cache-from: type=gha,scope=prod-frontend
          cache-to: type=gha,mode=max,scope=prod-frontend

  # Деплой на хост (PLAN §2.4–2.6): checkout, env-инжект, бэкап (неотключаем),
  # predeploy-теги, pull ghcr-образов, миграции до up, rag-embedder на хосте,
  # up полного набора, freshness, gateway-проверки, post-gates.
  deploy:
    name: Deploy on prod host
    needs: [gates, build]
    runs-on: ubuntu-latest
    environment: prod
    steps:
      # Без checkout в этом job workspace пуст — шаг «Upload pipeline scripts»
      # не найдёт локальные deploy/scripts/*.sh для scp (факт T1 2026-09-13,
      # run 34782475340: «scp: stat local … No such file or directory»).
      - name: Checkout source
        uses: actions/checkout@v4

      # Скрипты пайплайна поставляются из checkout CI (реф workflow = main),
      # а не из checkout целевого SHA на хосте: репетиция на SHA, предшествующем
      # #966, иначе не находит deploy/scripts/prod_migrate.sh на хосте
      # (факт T1 2026-09-13: ref=d9bedacf, «No such file or directory»).
      - name: Upload pipeline scripts to prod host
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_USER: ${{ secrets.PROD_USER }}
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
        run: |
          set -euo pipefail
          KEY_FILE="$(mktemp)"
          printf '%s\n' "${PROD_SSH_KEY}" > "${KEY_FILE}"
          chmod 600 "${KEY_FILE}"
          ssh -o StrictHostKeyChecking=accept-new -i "${KEY_FILE}" \
            "${PROD_USER}@${PROD_HOST}" "mkdir -p /opt/processmap/bin"
          scp -o StrictHostKeyChecking=accept-new -i "${KEY_FILE}" \
            deploy/scripts/prod_preflight_gates.sh \
            deploy/scripts/prod_migrate.sh \
            deploy/scripts/prod_post_gates.sh \
            "${PROD_USER}@${PROD_HOST}:/opt/processmap/bin/"
          rm -f "${KEY_FILE}"

      - name: Deploy to prod server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          command_timeout: 30m
          # GHCR_PULL_TOKEN передаётся на хост только если задан; публичный
          # репозиторий тянет образы анонимно (см. шаг pull ниже).
          envs: GHCR_PULL_TOKEN
          envs_format: export
          script: |
            set -euo pipefail
            cd /opt/processmap/app

            COMPOSE_PROJECT_NAME=app
            export COMPOSE_PROJECT_NAME
            if [ "${COMPOSE_PROJECT_NAME}" != "app" ]; then
              echo "[deploy-prod] ERROR: COMPOSE_PROJECT_NAME must be 'app', got '${COMPOSE_PROJECT_NAME}'"
              exit 1
            fi

            DEPLOY_SHA="${{ needs.gates.outputs.deploy_sha }}"
            REQUESTED_REF="${{ needs.gates.outputs.requested_ref }}"
            BUILD_TIME="${{ needs.gates.outputs.build_time }}"
            TS="${{ needs.gates.outputs.ts }}"
            DEPLOY_FINGERPRINT="processmap-prod-deploy-sha:${DEPLOY_SHA}"
            ENV_FILE="/opt/processmap/env/prod.env"
            BACKUP_DIR="/opt/processmap/data/prod/backups"
            REGISTRY="ghcr.io"
            NAMESPACE="xiaomibelov/processmap_v1"

            echo "[deploy-prod] deploy_sha=${DEPLOY_SHA} ref=${REQUESTED_REF} ts=${TS}"

            # --- checkout на задеплоенный SHA (pristine-gate уже прошёл) ---
            git remote set-url origin git@github.com:xiaomibelov/processmap_v1.git
            git fetch origin
            git checkout -f "${DEPLOY_SHA}"

            # --- BUILD-метаданные в prod.env (логика прежнего ручного деплоя) ---
            PREVIOUS_BUILD_ID=$(grep -E '^BUILD_ID=' "${ENV_FILE}" 2>/dev/null | cut -d= -f2- || echo "unknown")
            sed -i '/^BUILD_ID=/d; /^BUILD_TIME=/d; /^BUILD_BRANCH=/d; /^BUILD_ENV=/d; /^PREVIOUS_BUILD_ID=/d' "${ENV_FILE}" 2>/dev/null || true
            {
              echo ""
              echo "# Auto-injected by deploy-prod.yml at ${BUILD_TIME}"
              echo "BUILD_ID=${DEPLOY_SHA}"
              echo "BUILD_TIME=${BUILD_TIME}"
              echo "BUILD_BRANCH=${REQUESTED_REF}"
              echo "BUILD_ENV=prod"
              echo "PREVIOUS_BUILD_ID=${PREVIOUS_BUILD_ID}"
            } >> "${ENV_FILE}"
            echo "[deploy-prod] env: PREVIOUS_BUILD_ID=${PREVIOUS_BUILD_ID} -> BUILD_ID=${DEPLOY_SHA}"

            # --- Страховка 1/2: бэкап БД (неотключаемый; отдельный approve на restore) ---
            mkdir -p "${BACKUP_DIR}"
            DUMP_NAME="pre-pipeline-${TS}.dump"
            echo "[deploy-prod] pg_dump -Fc -> ${BACKUP_DIR}/${DUMP_NAME}"
            # Sidecar-паттерн (recon 2026-09-23): docker exec в существующие
            # контейнеры сломан на хосте (libseccomp SetSSB, см. RECON_PROD.md
            # контура prod-deploy-hygiene-rollback-audit) — pg_dump исполняем
            # throwaway-контейнером postgres:16-alpine (образ присутствует
            # локально) в сети app_default. Креды БД — из prod.env через
            # --env-file (DATABASE_URL), в лог не попадают. Запись атомарна:
            # .tmp + rename.
            docker run --rm \
              --network app_default \
              --env-file "${ENV_FILE}" \
              -e DUMP_NAME="${DUMP_NAME}" \
              -v "${BACKUP_DIR}:/backup" \
              postgres:16-alpine sh -c '
                set -e
                pg_dump "${DATABASE_URL}" -Fc -f "/backup/${DUMP_NAME}.tmp" \
                  && mv "/backup/${DUMP_NAME}.tmp" "/backup/${DUMP_NAME}"
              '
            [ -s "${BACKUP_DIR}/${DUMP_NAME}" ] || { echo "ERROR: дамп ${BACKUP_DIR}/${DUMP_NAME} пуст или не создан" >&2; exit 1; }
            # Верификация дампа: pg_restore --list обязан распарсить оглавление.
            docker run --rm \
              -v "${BACKUP_DIR}:/backup:ro" \
              postgres:16-alpine pg_restore --list "/backup/${DUMP_NAME}" > /dev/null \
              || { echo "ERROR: pg_restore --list не смог прочитать дамп ${BACKUP_DIR}/${DUMP_NAME}" >&2; exit 1; }
            echo "OK: backup verified (${BACKUP_DIR}/${DUMP_NAME})"

            # --- Страховка 2/2: predeploy-теги образов (единственная достоверная точка «как было») ---
            for svc in api celery-worker agent notifications frontend; do
              docker image inspect "app-${svc}:latest" >/dev/null 2>&1 \
                || { echo "ERROR: app-${svc}:latest не найден — нечего тегировать predeploy" >&2; exit 1; }
              docker tag "app-${svc}:latest" "app-${svc}:predeploy-${TS}"
            done
            # gateway: standalone-стек на pinned nginx:1.27-alpine — тегируем
            # legacy-имя, только если оно ещё существует на хосте.
            if docker image inspect processmap-gateway:dev >/dev/null 2>&1; then
              docker tag processmap-gateway:dev "processmap-gateway:predeploy-${TS}"
            else
              echo "[deploy-prod] NOTE: processmap-gateway:dev отсутствует (standalone-gateway pinned nginx — тег не нужен)"
            fi
            echo "OK: predeploy tags created (ts=${TS})"

            # --- pull ghcr-образов + retag в app-<svc>:latest ---
            # Репозиторий публичный → пакеты ghcr публичные, anonymous pull штатен.
            # docker login выполняем только если задан GHCR_PULL_TOKEN (например, при
            # переводе репозитория в private — тогда секрет обязателен).
            if [ -n "${GHCR_PULL_TOKEN:-}" ]; then
              echo "${GHCR_PULL_TOKEN}" | docker login ghcr.io -u "${{ github.repository_owner }}" --password-stdin
            else
              echo "[deploy-prod] GHCR_PULL_TOKEN не задан — anonymous pull (публичный репозиторий)"
            fi
            for svc in api celery-worker agent notifications frontend; do
              docker pull "${REGISTRY}/${NAMESPACE}/${svc}:${DEPLOY_SHA}"
              docker tag "${REGISTRY}/${NAMESPACE}/${svc}:${DEPLOY_SHA}" "app-${svc}:latest"
            done
            echo "OK: images pulled and tagged app-<svc>:latest"

            # --- миграции ДО up, новым образом (PLAN §2.5.3) ---
            ENV_FILE="${ENV_FILE}" /opt/processmap/bin/prod_migrate.sh "${REGISTRY}/${NAMESPACE}/api:${DEPLOY_SHA}"

            # --- rag-embedder собирается на хосте (ONNX-экспорт, хост-специфично) ---
            APP_ENV_FILE="${ENV_FILE}" docker compose \
              --env-file "${ENV_FILE}" \
              -f docker-compose.yml \
              -f docker-compose.prod.yml \
              -f docker-compose.prod.standalone-gateway.yml \
              -p app \
              build rag-embedder

            # --- пересоздание контейнеров (полный набор; #2.5.4: rag-embedder
            # перечислен явно, т.к. --no-deps не стартует depends_on) ---
            APP_ENV_FILE="${ENV_FILE}" docker compose \
              --env-file "${ENV_FILE}" \
              -f docker-compose.yml \
              -f docker-compose.prod.yml \
              -f docker-compose.prod.standalone-gateway.yml \
              -p app \
              rm -fsv gateway frontend 2>/dev/null || true
            docker volume ls -q | grep '^app_' | xargs -r docker volume rm 2>/dev/null || true
            APP_ENV_FILE="${ENV_FILE}" docker compose \
              --env-file "${ENV_FILE}" \
              -f docker-compose.yml \
              -f docker-compose.prod.yml \
              -f docker-compose.prod.standalone-gateway.yml \
              -p app \
              up -d --no-deps --force-recreate -V \
                api gateway celery-worker celery-beat agent notifications frontend rag-embedder

            # --- gateway reload + пост-проверка маршрутизации ---
            # Recon 2026-09-23: nginx в gateway резолвит статический
            # proxy_pass http://frontend:80 один раз на старте воркера.
            # Деплой пересоздаёт gateway вместе с frontend, НО тот же
            # stale-upstream риск создаёт watchdog (cron */30, recreate
            # frontend без recreate gateway — ровно stage-инцидент 23.09,
            # починенный для stage в #1030). HUP через docker kill — без
            # docker exec (exec сломан на текущем наборе контейнеров, см.
            # RECON_PROD.md контура), в свежесозданных контейнерах тоже OK.
            # Пост-проверка маршрутизации: публичный URL (rollback-скрипт ходит
            # так же). NB: 443 слушает только 45.87.104.69:443 (standalone
            # bind) — curl на 127.0.0.1/--resolve к loopback = ложный негатив
            # (факты двух прогонов #1031, проверено read-only на хосте).
            echo "[deploy-prod] reloading gateway (re-resolve upstreams)"
            docker kill -s HUP app-gateway-1 2>/dev/null \
              && echo "[deploy-prod] gateway HUP sent" \
              || echo "[deploy-prod] WARN: gateway HUP failed (проверь upstream вручную)" >&2
            sleep 3
            curl -fsS -m 15 https://processmap.ru/ | grep -q 'assets/index-' \
              || { echo "ERROR: served prod HTML не ссылается на assets/index-*.js (stale upstream / frontend не поднялся)" >&2; exit 1; }
            echo "OK: gateway serves fresh frontend bundle"

            # --- freshness proof: 6/6 сервисов на свежих образах ---
            echo "[deploy-prod] freshness proof (container image == fresh app-<svc>:latest)"
            for svc in api celery-worker agent notifications frontend; do
              expected_img="$(docker image inspect "app-${svc}:latest" --format '{{.Id}}' 2>/dev/null || echo missing)"
              actual_img="$(docker inspect "app-${svc}-1" --format '{{.Image}}' 2>/dev/null || echo missing)"
              echo "[deploy-prod] ${svc}: running=${actual_img} expected=${expected_img}"
              if [ "${expected_img}" = "missing" ] || [ "${actual_img}" != "${expected_img}" ]; then
                echo "ERROR: ${svc} runs stale image" >&2
                exit 1
              fi
            done
            # celery-beat: ghcr-пакета beat нет — бежит на образе celery-worker.
            beat_expected="$(docker image inspect "app-celery-worker:latest" --format '{{.Id}}' 2>/dev/null || echo missing)"
            beat_actual="$(docker inspect "app-celery-beat-1" --format '{{.Image}}' 2>/dev/null || echo missing)"
            echo "[deploy-prod] celery-beat: running=${beat_actual} expected(worker image)=${beat_expected}"
            if [ "${beat_expected}" = "missing" ] || [ "${beat_actual}" != "${beat_expected}" ]; then
              echo "ERROR: celery-beat runs stale image" >&2
              exit 1
            fi
            echo "OK: all prod services run freshly pulled images"

            # --- gateway-проверки (standalone pinned nginx) ---
            GATEWAY_IMAGE="$(docker inspect app-gateway-1 --format '{{.Config.Image}}' 2>/dev/null || echo missing)"
            echo "[deploy-prod] gateway: image=${GATEWAY_IMAGE}"
            [ "${GATEWAY_IMAGE}" = "nginx:1.27-alpine" ] || { echo "ERROR: gateway runs '${GATEWAY_IMAGE}', expected nginx:1.27-alpine" >&2; exit 1; }
            docker exec app-gateway-1 nginx -t || { echo "ERROR: gateway nginx -t failed" >&2; exit 1; }
            crontab -l 2>/dev/null | grep -q 'prod-gateway/certbot-renew.sh' \
              || { echo "ERROR: prod-gateway certbot-renew cron missing (см. deploy/prod-gateway/README.md)" >&2; exit 1; }
            echo "OK: gateway image/config + renew cron verified"

            # --- post-gates + markdown-summary для $GITHUB_STEP_SUMMARY ---
            SUMMARY_FILE="${BACKUP_DIR}/last-deploy-summary-${TS}.md" \
              /opt/processmap/bin/prod_post_gates.sh "${DEPLOY_SHA}"

            echo "[deploy-prod] done sha=${DEPLOY_SHA} ts=${TS}"

      - name: Publish deploy summary
        shell: bash
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_USER: ${{ secrets.PROD_USER }}
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          TS: ${{ needs.gates.outputs.ts }}
        run: |
          set -euo pipefail
          KEY_FILE="$(mktemp)"
          printf '%s\n' "${PROD_SSH_KEY}" > "${KEY_FILE}"
          chmod 600 "${KEY_FILE}"
          ssh -o StrictHostKeyChecking=accept-new -i "${KEY_FILE}" \
            "${PROD_USER}@${PROD_HOST}" \
            "cat /opt/processmap/data/prod/backups/last-deploy-summary-${TS}.md" \
            >> "${GITHUB_STEP_SUMMARY}"
          rm -f "${KEY_FILE}"
