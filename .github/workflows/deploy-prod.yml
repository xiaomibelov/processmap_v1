name: Deploy to Prod

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to prod server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGE_HOST }}
          username: ${{ secrets.STAGE_USER }}
          key: ${{ secrets.STAGE_SSH_KEY }}
          command_timeout: 20m
          script: |
            set -euo pipefail
            cd /opt/processmap/app

            COMPOSE_PROJECT_NAME=app
            export COMPOSE_PROJECT_NAME
            if [ "${COMPOSE_PROJECT_NAME}" != "app" ]; then
              echo "[deploy-prod] ERROR: COMPOSE_PROJECT_NAME must be 'app', got '${COMPOSE_PROJECT_NAME}'"
              exit 1
            fi

            # Pull latest source code only, preserve server configs.
            # tools/ обязателен: Dockerfile (COPY tools/graphify-*) запекает его в образ;
            # без checkout этого пути на проде остаются протухшие файлы
            # (audit/prod-stage-divergence-409, 2026-08-30).
            git checkout origin/main -- backend frontend Dockerfile deploy tools \
              docker-compose.yml docker-compose.prod.yml docker-compose.prod.gateway.yml \
              docker-compose.ssl.yml Dockerfile.gateway.prod

            # Resolve git metadata from origin/main (HEAD may be on a different branch)
            GIT_SHA=$(git rev-parse origin/main)
            GIT_REF="main"
            BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)
            DEPLOY_FINGERPRINT="processmap-prod-deploy-sha:${GIT_SHA}"

            CURRENT_SHA=$(git rev-parse HEAD)
            echo "[deploy-prod] current checkout SHA: ${CURRENT_SHA}"
            echo "[deploy-prod] target SHA: ${GIT_SHA}"

            # Persist build metadata in the prod env file so the API /version endpoint
            # reports the deployed SHA instead of whatever the local repo HEAD was.
            ENV_FILE="/opt/processmap/env/prod.env"
            PREVIOUS_BUILD_ID=$(grep -E '^BUILD_ID=' "${ENV_FILE}" 2>/dev/null | cut -d= -f2- || echo "unknown")
            sed -i '/^BUILD_ID=/d; /^BUILD_TIME=/d; /^BUILD_BRANCH=/d; /^BUILD_ENV=/d; /^PREVIOUS_BUILD_ID=/d' "${ENV_FILE}" 2>/dev/null || true
            {
              echo ""
              echo "# Auto-injected by deploy-prod.yml at ${BUILD_TIME}"
              echo "BUILD_ID=${GIT_SHA}"
              echo "BUILD_TIME=${BUILD_TIME}"
              echo "BUILD_BRANCH=${GIT_REF}"
              echo "BUILD_ENV=prod"
              echo "PREVIOUS_BUILD_ID=${PREVIOUS_BUILD_ID}"
            } >> "${ENV_FILE}"

            # Save current images as rollback point before rebuilding
            for img in processmap-gateway:dev app-api:latest app-celery-worker:latest app-agent:latest app-notifications:latest app-frontend:latest; do
              tag="${img##*:}"
              name="${img%:*}"
              docker tag "${img}" "${name}:rollback" 2>/dev/null || echo "[deploy-prod] WARN: could not tag ${img} as rollback"
            done

            # Full prod service set. Partial deploy is forbidden: every service must be rebuilt
            # from the same SHA to avoid split-brain (see audit/prod-deploy-incident-audit).
            PROD_SERVICES="api gateway celery-worker agent notifications frontend"

            # Rebuild api, celery-worker, agent, notifications (cached) with backend metadata.
            APP_ENV_FILE=/opt/processmap/env/prod.env docker compose \
              --env-file /opt/processmap/env/prod.env \
              -f docker-compose.yml \
              -f docker-compose.prod.yml \
              -f docker-compose.ssl.yml \
              -f docker-compose.prod.gateway.yml \
              -p app \
              build \
                --build-arg BUILD_ID="${GIT_SHA}" \
                --build-arg BUILD_TIME="${BUILD_TIME}" \
                --build-arg BUILD_BRANCH="${GIT_REF}" \
                --build-arg BUILD_ENV=prod \
                api celery-worker agent notifications

            # Rebuild frontend (prod gateway image) without cache so fresh statics + fingerprint are baked in.
            APP_ENV_FILE=/opt/processmap/env/prod.env docker compose \
              --env-file /opt/processmap/env/prod.env \
              -f docker-compose.yml \
              -f docker-compose.prod.yml \
              -f docker-compose.ssl.yml \
              -f docker-compose.prod.gateway.yml \
              -p app \
              build --no-cache \
                --build-arg VITE_BUILD_ID="${GIT_SHA}" \
                --build-arg VITE_BUILD_BRANCH="${GIT_REF}" \
                --build-arg VITE_BUILD_TIME="${BUILD_TIME}" \
                --build-arg VITE_DEPLOY_FINGERPRINT="${DEPLOY_FINGERPRINT}" \
                --build-arg VITE_DEPLOY_REQUESTED_REF="${GIT_REF}" \
                --build-arg VITE_DEPLOY_RESOLVED_SHA="${GIT_SHA}" \
                gateway

            # Rebuild standalone frontend service so it matches the same SHA (does not serve traffic in prod).
            APP_ENV_FILE=/opt/processmap/env/prod.env docker compose \
              --env-file /opt/processmap/env/prod.env \
              -f docker-compose.yml \
              -f docker-compose.prod.yml \
              -f docker-compose.ssl.yml \
              -f docker-compose.prod.gateway.yml \
              -p app \
              build --no-cache \
                --build-arg VITE_BUILD_ID="${GIT_SHA}" \
                --build-arg VITE_BUILD_BRANCH="${GIT_REF}" \
                --build-arg VITE_BUILD_TIME="${BUILD_TIME}" \
                --build-arg VITE_DEPLOY_FINGERPRINT="${DEPLOY_FINGERPRINT}" \
                --build-arg VITE_DEPLOY_REQUESTED_REF="${GIT_REF}" \
                --build-arg VITE_DEPLOY_RESOLVED_SHA="${GIT_SHA}" \
                frontend

            # Remove the old gateway/frontend containers and any attached volumes so stale statics cannot survive.
            docker compose \
              --env-file /opt/processmap/env/prod.env \
              -f docker-compose.yml \
              -f docker-compose.prod.yml \
              -f docker-compose.ssl.yml \
              -f docker-compose.prod.gateway.yml \
              -p app \
              rm -fsv gateway frontend 2>/dev/null || true
            # Drop any project named volume that could mask /usr/share/nginx/html
            docker volume ls -q | grep '^app_' | xargs -r docker volume rm 2>/dev/null || true

            # Start fresh containers (renew anonymous volumes to pull files from the new image)
            APP_ENV_FILE=/opt/processmap/env/prod.env docker compose \
              --env-file /opt/processmap/env/prod.env \
              -f docker-compose.yml \
              -f docker-compose.prod.yml \
              -f docker-compose.ssl.yml \
              -f docker-compose.prod.gateway.yml \
              -p app \
              up -d --no-deps --force-recreate -V ${PROD_SERVICES}

            # Freshness proof для не-api сервисов: каждый пересобранный контейнер обязан
            # бежать на только что собранном образе. Проверка /version ниже покрывает
            # только api и не заметит stale celery-worker/agent/notifications.
            echo "[deploy-prod] non-api freshness proof (container image == freshly built)"
            for svc in api celery-worker agent notifications frontend; do
              expected_img="$(docker image inspect "app-${svc}:latest" --format '{{.Id}}' 2>/dev/null || echo missing)"
              actual_img="$(docker inspect "app-${svc}-1" --format '{{.Image}}' 2>/dev/null || echo missing)"
              echo "[deploy-prod] ${svc}: running=${actual_img} built=${expected_img}"
              if [ "${expected_img}" = "missing" ] || [ "${actual_img}" != "${expected_img}" ]; then
                echo "ERROR: ${svc} container is not running the freshly built image" >&2
                exit 1
              fi
            done
            echo "OK: all prod services run the freshly built images"

            # Post-deploy freshness proof: poll /version (api стартует не мгновенно —
            # entrypoint гонит миграции/сиды; 502 первые N секунд — норма, не fail).
            echo "[deploy-prod] waiting for prod gateway/api to come up (poll up to 180s)..."
            VERSION_RESPONSE=""
            LAST_HTTP="000"
            for attempt in $(seq 1 18); do
              VERSION_RESPONSE=$(curl -sS -m 10 -w '\n__HTTP__%{http_code}' https://processmap.ru/version 2>&1 || true)
              LAST_HTTP=$(echo "${VERSION_RESPONSE}" | grep -o '__HTTP__[0-9]*' | tail -1 | sed 's/__HTTP__//')
              if [ "${LAST_HTTP}" = "200" ]; then break; fi
              echo "[deploy-prod] /version not ready (http=${LAST_HTTP:-000}, attempt ${attempt}/18) — retry in 10s"
              sleep 10
            done
            echo "=== Prod /version ==="
            echo "${VERSION_RESPONSE}" | sed 's/__HTTP__[0-9]*//' | head -c 500
            echo
            if [ "${LAST_HTTP}" != "200" ]; then
              echo "ERROR: api unhealthy — /version http=${LAST_HTTP:-000} после 180s ожидания."
              echo "Проверьте: docker ps -a --filter name=app-api-1 ; docker logs app-api-1 --tail 100"
              exit 1
            fi
            if echo "${VERSION_RESPONSE}" | grep -q "\"commit\":\"${GIT_SHA}\""; then
              echo "OK: /version commit matches ${GIT_SHA}"
            else
              echo "ERROR: /version отвечает 200, но commit != ${GIT_SHA} (запущен старый api-образ?)"
              exit 1
            fi

            echo "=== Prod /api/health ==="
            curl -fsS https://processmap.ru/api/health || echo "ERROR: /api/health unreachable"
            echo

            echo "=== Prod frontend fingerprint ==="
            MAIN_JS=$(curl -fsS https://processmap.ru/ | grep -oE 'assets/index-[A-Za-z0-9_-]*\.js' | head -1)
            if [ -n "${MAIN_JS}" ]; then
              FINGERPRINT=$(curl -fsS "https://processmap.ru/${MAIN_JS}" \
                | grep -oE "processmap-prod-deploy-sha:[a-f0-9]+" \
                | head -1)
              echo "${FINGERPRINT}"
              if echo "${FINGERPRINT}" | grep -q "${GIT_SHA}"; then
                echo "OK: frontend fingerprint matches ${GIT_SHA}"
              else
                echo "ERROR: frontend fingerprint does not match ${GIT_SHA}"
                exit 1
              fi
            else
              echo "ERROR: could not locate main JS asset"
              exit 1
            fi

            echo "[deploy-prod] done"

  verify:
    name: Post-deploy verify
    needs: deploy
    if: always() && needs.deploy.result == 'success'
    uses: ./.github/workflows/prod-deploy-verify.yml
    secrets: inherit

  rollback-on-failure:
    name: Auto-rollback on verify failure
    needs: verify
    if: always() && needs.verify.result == 'failure'
    uses: ./.github/workflows/rollback-prod.yml
    secrets: inherit
