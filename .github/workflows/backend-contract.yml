name: backend-contract

# Contract-тестирование OpenAPI (schemathesis) + drift живой спеки (Этап 3).
#
# - PR/push: быстрый contract-прогон (pr-профиль, 10 примеров/операцию).
# - Nightly: полный suite бэкенда с записью API-покрытия + nightly-профиль фаззинга
#   (75 примеров/операцию) + HTML/JSON отчёты артефактами.
# - spec-drift: oasdiff поверх живой спеки (app.openapi()) против коммит-снапшота
#   docs/openapi.yaml. Информационный (continue-on-error): снапшот ведётся вручную,
#   дрейф ожидаем; артефакт build/spec-drift.txt — для ревью.

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-contract.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-contract.yml"
  schedule:
    - cron: "0 3 * * *" # nightly 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11" # как в продовом Docker-образе backend
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r backend/requirements-dev.txt

      - name: Contract fuzz (pr profile)
        run: |
          cd backend
          python -m pytest -m contract tests/contract -q

      - name: Upload operations summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contract-operations
          path: build/contract-operations.json
          if-no-files-found: ignore

  spec-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          # httpx — pinned как в requirements-dev.txt: нужен TestClient в dump_openapi.py
          pip install -r backend/requirements.txt PyYAML httpx==0.27.2

      - name: Dump live OpenAPI
        run: python scripts/dump_openapi.py --format yaml --out build/openapi-live.yaml

      - name: oasdiff (live vs snapshot)
        run: |
          set +e
          mkdir -p build
          docker run --rm -v "$PWD:/specs" tufin/oasdiff:latest \
            diff /specs/docs/openapi.yaml /specs/build/openapi-live.yaml \
            > build/spec-drift.txt
          DIFF_EXIT=$?
          docker run --rm -v "$PWD:/specs" tufin/oasdiff:latest \
            breaking /specs/docs/openapi.yaml /specs/build/openapi-live.yaml \
            > build/spec-drift-breaking.txt
          BREAKING_EXIT=$?
          set -e

          echo "--- drift summary ---"
          cat build/spec-drift.txt
          echo "--- breaking summary ---"
          cat build/spec-drift-breaking.txt

          # oasdiff diff returns 0 even when differences exist; treat any non-empty output as drift.
          DIFF_OUTPUT="$(cat build/spec-drift.txt | tr -d '[:space:]')"
          if [[ -n "$DIFF_OUTPUT" && "$DIFF_OUTPUT" != "{}" ]]; then
            echo ""
            echo "❌ ERROR: docs/openapi.yaml is out of sync with the live API."
            echo "   Regenerate it with: ./scripts/update_openapi.sh   (or: make openapi)"
            echo "   Then commit the updated docs/openapi.yaml."
            exit 1
          fi

          if [[ "$BREAKING_EXIT" -ne 0 ]]; then
            PR_TEXT="${{ github.event.pull_request.title }} ${{ github.event.pull_request.body }}"
            if echo "$PR_TEXT" | grep -q 'BREAKING-API-OK'; then
              echo "⚠️ Breaking API changes detected, but BREAKING-API-OK marker found — allowing."
            else
              echo ""
              echo "❌ ERROR: breaking API changes detected and BREAKING-API-OK marker is missing."
              echo "   Add BREAKING-API-OK to the PR title or description if the breaking change is intentional."
              echo "   Then regenerate docs/openapi.yaml with: ./scripts/update_openapi.sh"
              exit 1
            fi
          fi

      - name: Upload drift report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spec-drift
          path: |
            build/spec-drift.txt
            build/spec-drift-breaking.txt
            build/openapi-live.yaml
          if-no-files-found: ignore

  nightly:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r backend/requirements-dev.txt

      - name: Full backend suite with API coverage
        run: |
          cd backend
          python -m pytest tests --api-coverage -q || true
        # || true: baseline на чистом main содержит pg-зависимые падения
        # (см. EXEC_REPORT.md) — nightly собирает покрытие, а не гейтит suite.

      - name: Contract fuzz (nightly profile)
        run: |
          cd backend
          CONTRACT_PROFILE=nightly python -m pytest -m contract tests/contract -q

      - name: Coverage report
        if: always()
        run: |
          python scripts/dump_openapi.py --format json --out build/openapi-live.json
          python scripts/api_coverage_report.py \
            --calls build/api-coverage-output/calls.jsonl \
            --spec build/openapi-live.json \
            --out-json build/api-coverage-results.json \
            --out-html build/api-coverage-report.html

      - name: Upload nightly artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-coverage-nightly
          path: |
            build/api-coverage-results.json
            build/api-coverage-report.html
            build/contract-operations.json
          if-no-files-found: ignore
