# Осознанные исключения contract-фаззинга (schemathesis).
# Каждое правило ОБЯЗАНО иметь reason. Операции указываются по operationId из /api/openapi.json.
#
# Баги, найденные фаззингом, НЕ маскируются здесь: им заводится запись в отчёте
# (.planning/contours/test/contract-openapi/EXEC_REPORT.md) и фикс отдельным коммитом.
# Сюда попадают только осознанные решения (см. reason).

# Политика методов: по умолчанию фаззим только read-only методы.
# Мутирующие операции на seeded-БД безопасны далеко не все (DELETE/PUT/PATCH ломают
# состояние между примерами hypothesis, POST — местами деструктивен или ходит во внешние
# сервисы). Безопасные create/query-операции — белым списком allowed_extra_operations.
method_policy:
  reason: >
    Деструктивные операции пока пропускаем (Этап 1, ТЗ): нет seed-фикстур, восстанавливающих
    состояние между примерами; иначе фаззинг одного примера ломает данные для следующего
    (ложные 404/409) и делает прогон недетерминированным. Расширение — через allowed_extra
    после появления reset-фикстур.
  allowed_methods: [GET]
  allowed_extra_operations:
    - id: auth_login_api_auth_login_post
      reason: "Публичный login: read-only по сути, валидные/невалидные креды — безопасны."
    - id: auth_refresh_api_auth_refresh_post
      reason: "Публичный refresh: ротация токенов в песочнице, безопасно."
    - id: auth_logout_api_auth_logout_post
      reason: "Публичный logout: инвалидация случайных/seeded токенов не влияет на другие операции (токен пересоздаётся на запрос)."
    - id: create_session_api_sessions_post
      reason: "Создание сессии в seeded org — аддитивно, не ломает другие операции; это и есть seed-фикстура для session_id."
    - id: create_project_session_api_projects__project_id__sessions_post
      reason: "Аналогично: аддитивное создание сессии в seeded project."
    - id: create_session_in_project_api_projects__project_id__explorer_sessions_post
      reason: "Аналогично: аддитивное создание сессии через explorer."
    - id: create_org_project_session_api_orgs__org_id__projects__project_id__sessions_post
      reason: "Аналогично: аддитивное создание сессии в org-scope."
    - id: query_product_actions_registry_api_analysis_product_actions_registry_query_post
      reason: "POST-запрос чтения (query над реестром), состояние не меняет."
    - id: query_process_properties_registry_api_analysis_properties_registry_query_post
      reason: "POST-запрос чтения, состояние не меняет."

