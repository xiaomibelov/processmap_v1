[pytest]
# Маркер contract: фаззинг OpenAPI-контракта (schemathesis, tests/contract/).
# Дефолтный прогон их исключает (addopts ниже), чтобы не замедлять основной suite.
# Явный запуск contract-тестов:   pytest -m contract
# Явный запуск только основных:   pytest -m "not contract"  (это и есть дефолт)
# NB: CLI-опция -m переопределяет -m из addopts, поэтому `pytest -m contract` работает.
markers =
    contract: OpenAPI contract fuzzing (schemathesis), runs separately via `pytest -m contract`
addopts = -m "not contract"
